name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the Build page's "Documented at" row reads git tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: src/requirements.txt
      - run: pip install -r src/requirements.txt
      - run: python -m pytest -q
        working-directory: src

  docs:
    # Builds every example from a clean checkout and fails on any Sphinx warning.
    # Schematics need yosys and netlistsvg, so they are switched off here.
    name: Docs (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [example, example_sv, example_ecp5, example_full]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: pip install -r src/requirements.txt
      - run: make doc-html SCHEMATICS=0 AUTODOC_SPHINXOPTS="-W --keep-going"
        working-directory: ${{ matrix.example }}
